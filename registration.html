<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Blossoms — Student Registration</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#182033;font-family:Arial,Helvetica,sans-serif}
.header{background:linear-gradient(135deg,#6c5ce7,#8e7cf6);color:white;padding:28px 20px}
.header-inner{max-width:1100px;margin:auto}
.brand{font-size:28px;font-weight:800}.sub{margin-top:5px;opacity:.85;font-size:13px}
.container{max-width:1100px;margin:25px auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
h1{font-size:24px;margin:0}.count{color:#737b8c;font-size:13px;margin-top:5px}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}
.add{background:#6c5ce7;color:white}.edit{background:#eeeafd;color:#5548b7}.delete{background:#ffe9e7;color:#bd3328}
.search{width:100%;padding:12px;border:1px solid #dfe3ec;border-radius:9px;margin-bottom:15px;outline:none}
.card{background:white;border:1px solid #e6e9f0;border-radius:15px;box-shadow:0 8px 28px #1d25400b;overflow:hidden}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f5;font-size:13px}
th{background:#fafbfe;color:#6e7688;font-size:11px;text-transform:uppercase}
.empty{text-align:center;padding:45px;color:#8a92a2}
.badge{background:#f0eeff;color:#594cc0;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700}
.modal-bg{display:none;position:fixed;inset:0;background:#10142688;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-bg.show{display:flex}.modal{width:520px;max-width:100%;background:white;border-radius:17px;padding:22px}
.modal h2{margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{display:block;font-size:11px;font-weight:700;color:#697286;margin-bottom:6px}
input{width:100%;padding:11px;border:1px solid #dfe3ec;border-radius:8px;outline:none}
.full{grid-column:1/-1}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cancel{background:#edf0f5;color:#465064}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.container{margin-top:18px}}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="brand">🌸 Little Blossoms</div>
<div class="sub">Play School • Student Registration</div>
</div>
</header>

<main class="container">
<div class="top">
<div>
<h1>Students</h1>
<div class="count" id="count">0 students registered</div>
</div>
<button class="add" onclick="openForm()">＋ Add Student / Registration</button>
</div>

<input id="search" class="search" placeholder="Search student, parent or phone..." oninput="render()">

<div class="card">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Student</th>
<th>Parent / Guardian</th>
<th>Phone</th>
<th>Monthly Fee</th>
<th>Registration Fee</th>
<th>Registration Date</th>
<th>Action</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</main>

<div id="modalBg" class="modal-bg">
<div class="modal">
<h2 id="modalTitle">Add Student</h2>
<div class="grid">
<div>
<label>STUDENT NAME *</label>
<input id="name" placeholder="Student name">
</div>
<div>
<label>PARENT / GUARDIAN</label>
<input id="parent" placeholder="Parent name">
</div>
<div>
<label>PHONE</label>
<input id="phone" type="tel" placeholder="Phone number">
</div>
<div>
<label>CLASS</label>
<input id="className" placeholder="Play Group / Nursery">
</div>
<div>
<label>MONTHLY FEE (₹)</label>
<input id="monthly" type="number" min="0" placeholder="5000">
</div>
<div>
<label>REGISTRATION FEE (₹)</label>
<input id="registration" type="number" min="0" placeholder="5000">
</div>
<div>
<label>REGISTRATION DATE</label>
<input id="regDate" type="date">
</div>
<div class="full">
<label>NOTE</label>
<input id="note" placeholder="Optional">
</div>
</div>
<div class="footer">
<button class="cancel" onclick="closeForm()">Cancel</button>
<button class="add" onclick="saveStudent()">Save Student</button>
</div>
</div>
</div>

<script>
const STORAGE_KEY="little_blossoms_students_v2";
let students=[];
let editingId=null;

function load(){
 try{
  const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  students=Array.isArray(data)?data:[];
 }catch(e){students=[]}
 render();
}

function save(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(students));
}

function id(){
 return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function openForm(studentId=null){
 editingId=studentId;
 const s=students.find(x=>x.id===studentId);
 document.getElementById("modalTitle").textContent=s?"Edit Student":"Add Student";
 document.getElementById("name").value=s?.name||"";
 document.getElementById("parent").value=s?.parent||"";
 document.getElementById("phone").value=s?.phone||"";
 document.getElementById("className").value=s?.className||"";
 document.getElementById("monthly").value=s?.monthlyFee??"";
 document.getElementById("registration").value=s?.registrationFee??"";
 document.getElementById("regDate").value=s?.registrationDate||today();
 document.getElementById("note").value=s?.note||"";
 document.getElementById("modalBg").classList.add("show");
 setTimeout(()=>document.getElementById("name").focus(),50);
}

function closeForm(){
 document.getElementById("modalBg").classList.remove("show");
 editingId=null;
}

function saveStudent(){
 const name=document.getElementById("name").value.trim();
 if(!name){alert("Student name zaroori hai.");return;}

 const data={
  id:editingId||id(),
  name:name,
  parent:document.getElementById("parent").value.trim(),
  phone:document.getElementById("phone").value.trim(),
  className:document.getElementById("className").value.trim(),
  monthlyFee:Number(document.getElementById("monthly").value)||0,
  registrationFee:Number(document.getElementById("registration").value)||0,
  registrationDate:document.getElementById("regDate").value||today(),
  note:document.getElementById("note").value.trim()
 };

 if(editingId){
   const index=students.findIndex(x=>x.id===editingId);
   if(index!==-1) students[index]=data;
 }else{
   students.push(data);
 }

 save();
 closeForm();
 render();
}

function deleteStudent(studentId){
 const s=students.find(x=>x.id===studentId);
 if(!s)return;
 if(confirm("Delete "+s.name+"?")){
  students=students.filter(x=>x.id!==studentId);
  save();
  render();
 }
}

function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const filtered=students.filter(s=>
  (s.name+" "+s.parent+" "+s.phone).toLowerCase().includes(q)
 );

 document.getElementById("count").textContent=
   students.length+" "+(students.length===1?"student":"students")+" registered";

 const rows=document.getElementById("rows");

 if(!filtered.length){
  rows.innerHTML='<tr><td colspan="7" class="empty">'+
   (students.length?"No student matches your search.":"No students registered yet. Click “Add Student / Registration”.")+
   '</td></tr>';
  return;
 }

 rows.innerHTML=filtered.map(s=>`
 <tr>
  <td><b>${esc(s.name)}</b><br>${s.className?'<span class="badge">'+esc(s.className)+'</span>':''}</td>
  <td>${esc(s.parent)}</td>
  <td>${esc(s.phone)}</td>
  <td><b>₹${Number(s.monthlyFee||0).toLocaleString("en-IN")}</b></td>
  <td><b>₹${Number(s.registrationFee||0).toLocaleString("en-IN")}</b></td>
  <td>${esc(s.registrationDate)}</td>
  <td>
   <button class="edit" onclick="openForm('${s.id}')">Edit</button>
   <button class="delete" onclick="deleteStudent('${s.id}')">Delete</button>
  </td>
 </tr>`).join("");
}

document.getElementById("modalBg").addEventListener("click",e=>{
 if(e.target.id==="modalBg")closeForm();
});

load();
</script>
</body>
</html>
