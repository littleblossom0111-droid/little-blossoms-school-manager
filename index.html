<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Blossoms — Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow:hidden;background:#f5e9df}
.bg{position:fixed;inset:0;background-image:url("little-blossoms-login-bg.png");background-size:cover;background-position:center;filter:saturate(.98)}
.overlay{position:fixed;inset:0;background:rgba(255,247,242,.10)}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.login{
 width:min(510px,92vw);padding:32px 42px 25px;border-radius:24px;
 background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);
 box-shadow:0 22px 60px rgba(50,25,45,.25);backdrop-filter:blur(10px);
 animation:float 4s ease-in-out infinite;
}
.logo{text-align:center}
.logo img{width:180px;max-width:70%;height:auto;display:block;margin:0 auto 8px}
.brand{font-size:31px;font-weight:800;color:#7138a5;margin-top:4px}
.tag{font-size:14px;color:#444;margin-top:7px}
.welcome{text-align:center;color:#d63384;font-size:23px;font-weight:800;margin:25px 0 4px}
.continue{text-align:center;color:#555;font-size:14px;margin-bottom:20px}
.field{position:relative;margin:12px 0}
.field input{width:100%;height:55px;border:1px solid #d7d7df;border-radius:11px;padding:0 48px 0 48px;font-size:15px;outline:none;background:rgba(255,255,255,.9)}
.field input:focus{border-color:#8244c3;box-shadow:0 0 0 3px rgba(130,68,195,.12)}
.icon{position:absolute;left:17px;top:16px;font-size:21px;color:#7138a5}
.eye{position:absolute;right:14px;top:15px;border:0;background:none;font-size:21px;cursor:pointer;color:#777}
.loginbtn{width:100%;height:55px;border:0;border-radius:11px;margin-top:10px;background:linear-gradient(135deg,#7138a5,#8d43c4);color:white;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(113,56,165,.25)}
.loginbtn:hover{transform:translateY(-1px)}
.error{text-align:center;color:#c7352d;font-size:13px;font-weight:700;min-height:18px;margin-top:10px}
.footer{text-align:center;color:#555;font-size:13px;margin-top:20px}
.footer span{color:#d63384}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:650px){
 .login{padding:25px 22px 20px}.brand{font-size:27px}.welcome{font-size:20px}
 .bg{background-position:center}
}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div class="wrap">
 <div class="login">
  <div class="logo">
   <img src="little-blossoms-login-bg.png" alt="" style="display:none">
   <div style="font-size:72px;line-height:1">🌳</div>
   <div class="brand">Little Blossoms</div>
   <div class="tag">Play School <span style="color:#d63384">•</span> Day Care <span style="color:#d63384">•</span> Learning with Love 💗</div>
  </div>
  <div class="welcome">Welcome Back!</div>
  <div class="continue">Please login to continue</div>
  <form id="loginForm">
   <div class="field"><span class="icon">👤</span><input id="user" autocomplete="username" placeholder="User ID" required></div>
   <div class="field"><span class="icon">🔒</span><input id="pass" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" class="eye" id="eye">👁</button></div>
   <button class="loginbtn" type="submit">🔐 &nbsp; LOGIN</button>
   <div class="error" id="error"></div>
  </form>
  <div class="footer">🌸 &nbsp;Nurturing Little Minds, Inspiring Bright Futures&nbsp; 🌸</div>
 </div>
</div>
<script>
const USER="Littleblossoms", PASS="admin1234";
document.getElementById("eye").onclick=()=>{
 const p=document.getElementById("pass");p.type=p.type==="password"?"text":"password";
};
document.getElementById("loginForm").onsubmit=e=>{
 e.preventDefault();
 const u=document.getElementById("user").value.trim(),p=document.getElementById("pass").value;
 if(u===USER && p===PASS){
   sessionStorage.setItem("little_blossoms_logged_in","1");
   location.href="dashboard.html";
 }else{
   document.getElementById("error").textContent="Incorrect ID or Password";
   document.getElementById("pass").value="";
 }
};
</script>
</body>
</html>
