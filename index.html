<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Blossoms — Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#fff}
.page{min-height:100vh;display:flex;background:#fff}
.photo{width:62%;background:url("little-blossoms-children.png") center/cover no-repeat;min-height:100vh}
.login-side{width:38%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:35px;background:linear-gradient(145deg,#fff8fc,#f6efff)}
.box{width:min(410px,100%);padding:38px 34px;background:rgba(255,255,255,.94);border:1px solid #eee4f4;border-radius:24px;box-shadow:0 18px 50px rgba(75,45,95,.13)}
.logo{text-align:center;font-size:56px;line-height:1;margin-bottom:8px}
.brand{text-align:center;font-size:32px;font-weight:800;color:#7138a5}
.tag{text-align:center;color:#666;font-size:13px;margin-top:7px}
.welcome{text-align:center;color:#d63384;font-size:22px;font-weight:800;margin-top:28px}
.help{text-align:center;color:#777;font-size:13px;margin:7px 0 22px}
.field{position:relative;margin:12px 0}
.field span{position:absolute;left:15px;top:15px;font-size:19px}
input{width:100%;height:52px;border:1px solid #ddd7e4;border-radius:10px;padding:0 45px;font-size:15px;outline:none;background:#fff}
input:focus{border-color:#7b43ad;box-shadow:0 0 0 3px rgba(123,67,173,.1)}
.eye{position:absolute;right:10px;top:8px;height:36px;border:0;background:transparent;cursor:pointer;font-size:18px}
.login{width:100%;height:52px;margin-top:9px;border:0;border-radius:10px;background:linear-gradient(135deg,#7138a5,#9249c5);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.error{text-align:center;min-height:18px;color:#c7352d;font-size:12px;font-weight:700;margin-top:10px}
.footer{text-align:center;color:#777;font-size:12px;margin-top:22px}.footer b{color:#d63384}
@media(max-width:800px){
 .page{display:block}.photo{width:100%;height:43vh;min-height:0;background-position:center}.login-side{width:100%;min-height:57vh;padding:22px}.box{padding:25px 22px;border-radius:20px}.brand{font-size:27px}.logo{font-size:45px}.welcome{margin-top:18px}
}
</style>
</head>
<body>
<div class="page">
  <div class="photo"></div>
  <div class="login-side">
    <div class="box">
      <div class="logo">🌳</div>
      <div class="brand">Little Blossoms</div>
      <div class="tag">Play School • Day Care • Learning with Love 💗</div>
      <div class="welcome">Welcome Back!</div>
      <div class="help">Please login to continue</div>
      <form id="loginForm">
        <div class="field"><span>👤</span><input id="user" placeholder="User ID" autocomplete="username" required></div>
        <div class="field"><span>🔒</span><input id="pass" type="password" placeholder="Password" autocomplete="current-password" required><button class="eye" id="eye" type="button">👁</button></div>
        <button class="login" type="submit">🔐 &nbsp; LOGIN</button>
        <div class="error" id="error"></div>
      </form>
      <div class="footer">🌸 Nurturing Little Minds, Inspiring Bright Futures 🌸</div>
    </div>
  </div>
</div>
<script>
const USER="Littleblossoms", PASS="admin1234";
document.getElementById("eye").onclick=()=>{
 const p=document.getElementById("pass");p.type=p.type==="password"?"text":"password";
};
document.getElementById("loginForm").onsubmit=e=>{
 e.preventDefault();
 if(document.getElementById("user").value.trim()===USER &&
    document.getElementById("pass").value===PASS){
   sessionStorage.setItem("little_blossoms_logged_in","1");
   location.href="dashboard.html";
 }else{
   document.getElementById("error").textContent="Incorrect ID or Password";
 }
};
</script>
</body>
</html>
