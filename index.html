<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Blossoms — Login</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#eee;font-family:Arial,Helvetica,sans-serif}
.page{position:relative;width:100vw;height:100vh;background:url("login-background.png") center center/cover no-repeat}
.login-area{position:absolute;left:33.3%;top:60.0%;width:29.0%;height:22.5%;display:flex;flex-direction:column;gap:10px}
.login-area input{height:26%;border:1px solid rgba(160,160,160,.45);border-radius:8px;background:rgba(255,255,255,.70);padding:0 52px;font-size:16px;outline:none;color:#333}
.login-area input:focus{background:rgba(255,255,255,.92);box-shadow:0 0 0 3px rgba(113,56,165,.18)}
.login-area button{height:28%;border:0;border-radius:8px;background:transparent;color:transparent;cursor:pointer}
.error{position:absolute;top:88%;left:38%;font-size:13px;color:#c7352d;font-weight:700;white-space:nowrap}
@media(max-width:700px){
 .page{background-size:cover;background-position:center}
 .login-area{left:26%;top:58%;width:48%;height:25%}
 .login-area input{font-size:13px}
}
</style>
</head>
<body>
<div class="page">
<form class="login-area" id="loginForm">
<input id="user" autocomplete="username" aria-label="User ID" placeholder="Littleblossoms" required>
<input id="pass" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
<button type="submit" aria-label="Login">LOGIN</button>
</form>
<div class="error" id="error"></div>
</div>
<script>
const USER="Littleblossoms", PASS="admin1234";
document.getElementById("loginForm").addEventListener("submit",function(e){
 e.preventDefault();
 if(document.getElementById("user").value.trim()===USER &&
    document.getElementById("pass").value===PASS){
   sessionStorage.setItem("little_blossoms_logged_in","1");
   location.href="dashboard.html";
 }else{
   document.getElementById("error").textContent="Incorrect ID or Password";
 }
});
</script>
</body>
</html>
